<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>海洋微塑料跨视野去重裁决</title>
<style>
  :root {
    --blue: #1463a5; --blue-dark:#0e4d82; --bg:#f2f5f8; --line:#d7dee6;
    --red:#c0392b; --red-bg:#fdecea; --green:#217a46; --green-bg:#e8f5ee;
    --gray:#5a6b7b;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:#1f2d3a; }
  header { background:var(--blue); color:#fff; padding:14px 22px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12.5px; opacity:.85; }
  main { max-width:1180px; margin:18px auto; padding:0 16px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .toolbar label { font-size:13px; color:var(--gray); }
  input[type=number], input[type=text] {
    padding:6px 8px; border:1px solid var(--line); border-radius:5px; font-size:13px; width:110px;
  }
  input.wide { width:150px; }
  button { border:none; border-radius:6px; padding:8px 16px; font-size:13.5px; cursor:pointer; }
  button.primary { background:var(--blue); color:#fff; }
  button.primary:hover { background:var(--blue-dark); }
  button.ghost { background:#fff; border:1px solid var(--line); color:#33475b; }
  button.ghost:hover { background:#eef3f8; }
  button.small { padding:3px 10px; font-size:12px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px; }
  .field-card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .field-card.invalid { border-color:var(--red); box-shadow:0 0 0 2px var(--red-bg); }
  .field-card h3 { margin:0 0 8px; font-size:14.5px; color:var(--blue-dark);
                   display:flex; justify-content:space-between; align-items:center; }
  .meta-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .meta-row label { font-size:12px; color:var(--gray); }
  table.parts { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; }
  table.parts th { text-align:left; color:var(--gray); font-weight:600; padding:3px 4px;
                   border-bottom:1px solid var(--line); }
  table.parts td { padding:2px 4px; }
  table.parts input { width:100%; min-width:0; padding:4px 5px; }
  tr.row-invalid { background:var(--red-bg); }
  input.invalid { border-color:var(--red); background:var(--red-bg); }
  .banner { border-radius:8px; padding:10px 14px; margin:12px 0; font-size:13.5px; display:none; }
  .banner.error { display:block; background:var(--red-bg); border:1px solid var(--red); color:#7c1f15; }
  .banner.error ul { margin:6px 0 0 18px; padding:0; }
  .banner.error code { background:#fff; border:1px solid var(--line); border-radius:3px;
                       padding:0 4px; font-size:12px; }
  .banner.ok { display:block; background:var(--green-bg); border:1px solid var(--green); color:var(--green); }
  #results { margin-top:18px; }
  .summary { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 16px;
          font-size:13px; min-width:130px; }
  .stat b { display:block; font-size:20px; color:var(--blue); margin-top:2px; }
  .particle { background:#fff; border:1px solid var(--line); border-radius:10px;
              padding:12px 16px; margin-bottom:12px; }
  .particle h3 { margin:0 0 6px; font-size:15px; color:var(--blue-dark); }
  .tag { display:inline-block; background:#e7f0f9; color:var(--blue-dark); border-radius:12px;
         padding:1px 10px; font-size:12px; margin-left:6px; }
  table.detail { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px; }
  table.detail th, table.detail td { border-bottom:1px solid #edf1f5; padding:5px 6px; text-align:left; }
  table.detail th { color:var(--gray); font-weight:600; }
  .note { font-size:12px; color:var(--gray); margin:6px 0 16px; }
  .rep { font-size:13px; background:#f6f9fc; border:1px dashed var(--line);
         border-radius:6px; padding:6px 10px; margin:6px 0; }
</style>
</head>
<body>
<header>
  <h1>海洋微塑料监测站 · 同一滤膜相邻显微视野拼接计数</h1>
  <p>录入 3–5 个视野的平移位置与带编号颗粒候选，发起跨视野去重裁决（全局精确优化，不做局部最近边贪心合并）。草稿自动保存在本浏览器，校验失败不会丢失。</p>
</header>

<main>
  <div class="toolbar">
    <label>容差（滤膜坐标，横/纵差共用，≤ 即关联）：</label>
    <input type="number" id="tolerance" min="0" step="any" value="2" />
    <span style="flex:1"></span>
    <button class="ghost" id="btnSample">载入示例</button>
    <button class="ghost" id="btnClear">清空草稿</button>
    <button class="ghost" id="btnAddField">+ 视野</button>
    <button class="primary" id="btnSubmit">发起去重裁决</button>
  </div>

  <div class="banner error" id="errorBox"><b>输入不合规，草稿已保留：</b><ul id="errorList"></ul></div>
  <div class="banner ok" id="okBox"></div>

  <div class="fields" id="fields"></div>

  <section id="results"></section>
  <p class="note">裁决目标（按序）：① 最终颗粒数最少 → ② 所选关联曼哈顿差总和最小（每颗粒取最小生成树）→
     ③ 仍相同时，按视野录入顺序展开的伙伴编号序列取字典序最小的唯一结论。
     关联前提：不同视野、类别相同、换算到滤膜坐标后 |Δx|、|Δy| 均不超过容差。</p>
</main>

<script>
"use strict";
const MIN_FIELDS = 3, MAX_FIELDS = 5;
const STORE_KEY = "particle-dedup-draft-v1";

function blankField(i) {
  return { name: `视野${i + 1}`, shift: {x: 0, y: 0},
           particles: [{id: "", x: 0, y: 0, category: ""}] };
}
function defaultDraft() {
  return { tolerance: 2, fields: [blankField(0), blankField(1), blankField(2)] };
}
function sampleDraft() {
  return {
    tolerance: 2,
    fields: [
      { name: "A区", shift: {x: 0, y: 0}, particles: [
        {id: "P1", x: 10, y: 10, category: "PE"},
        {id: "P2", x: 50, y: 50, category: "PP"} ] },
      { name: "B区", shift: {x: 10, y: 0}, particles: [
        {id: "Q1", x: 0, y: 10, category: "PE"},
        {id: "Q2", x: 40, y: 50, category: "PP"} ] },
      { name: "C区", shift: {x: 10, y: 10}, particles: [
        {id: "R1", x: 0, y: 0, category: "PE"},
        {id: "R2", x: 40, y: 40, category: "PP"} ] },
    ],
  };
}

let state = loadDraft();

function loadDraft() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.fields)) return d; }
  } catch (e) { /* 损坏则回退默认 */ }
  return defaultDraft();
}
function saveDraft() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render() {
  document.getElementById("tolerance").value = state.tolerance;
  const box = document.getElementById("fields");
  box.innerHTML = "";
  state.fields.forEach((f, fi) => {
    const card = document.createElement("div");
    card.className = "field-card";
    card.dataset.fieldIndex = fi;
    card.innerHTML = `
      <h3><span>视野 ${fi + 1}</span>
        <button class="small ghost" data-act="del-field" ${state.fields.length <= MIN_FIELDS ? "disabled" : ""}>删除</button>
      </h3>
      <div class="meta-row">
        <label>名称</label>
        <input type="text" class="wide" data-loc="fields[${fi}].name" value="${esc(f.name)}" data-k="name">
        <label>平移 x</label>
        <input type="number" step="any" data-loc="fields[${fi}].shift.x" value="${f.shift.x}" data-k="shift.x">
        <label>平移 y</label>
        <input type="number" step="any" data-loc="fields[${fi}].shift.y" value="${f.shift.y}" data-k="shift.y">
      </div>
      <table class="parts">
        <thead><tr><th style="width:22%">编号</th><th style="width:18%">局部x</th>
          <th style="width:18%">局部y</th><th style="width:30%">聚合物类别</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <button class="small ghost" data-act="add-particle" style="margin-top:6px">+ 颗粒候选</button>`;
    const tbody = card.querySelector("tbody");
    f.particles.forEach((p, pi) => {
      const tr = document.createElement("tr");
      tr.dataset.pIndex = pi;
      tr.innerHTML = `
        <td><input type="text" data-loc="fields[${fi}].particles[${pi}].id"
                   data-k="id" value="${esc(p.id)}" placeholder="如 P1"></td>
        <td><input type="number" step="1" data-loc="fields[${fi}].particles[${pi}].x"
                   data-k="x" value="${p.x}"></td>
        <td><input type="number" step="1" data-loc="fields[${fi}].particles[${pi}].y"
                   data-k="y" value="${p.y}"></td>
        <td><input type="text" data-loc="fields[${fi}].particles[${pi}].category"
                   data-k="category" value="${esc(p.category)}" placeholder="如 PE / PP"></td>
        <td><button class="small ghost" data-act="del-particle">×</button></td>`;
      tbody.appendChild(tr);
    });
    box.appendChild(card);
  });
  document.getElementById("btnAddField").disabled = state.fields.length >= MAX_FIELDS;
  clearHighlights();
}

function clearHighlights() {
  document.querySelectorAll(".invalid").forEach(el => el.classList.remove("invalid"));
  document.querySelectorAll(".row-invalid").forEach(el => el.classList.remove("row-invalid"));
}

function locate(loc) {
  // 精确定位到输入框；行/卡片级错误向上归并高亮
  const direct = document.querySelector(`[data-loc="${CSS.escape(loc)}"]`);
  if (direct) { direct.classList.add("invalid"); return; }
  const m = loc.match(/^fields\[(\d+)\]\.particles\[(\d+)\]/);
  if (m) {
    const card = document.querySelector(`.field-card[data-field-index="${m[1]}"]`);
    const row = card && card.querySelector(`tr[data-p-index="${m[2]}"]`);
    if (row) row.classList.add("row-invalid");
    if (card) card.classList.add("invalid");
    return;
  }
  const fm = loc.match(/^fields\[(\d+)\]/);
  if (fm) {
    const card = document.querySelector(`.field-card[data-field-index="${fm[1]}"]`);
    if (card) card.classList.add("invalid");
  }
}

// 委托：任意输入实时回写 state 并持久化草稿
document.getElementById("fields").addEventListener("input", (ev) => {
  const el = ev.target;
  const card = el.closest(".field-card");
  if (!card || !el.dataset.k) return;
  const fi = +card.dataset.fieldIndex;
  const row = el.closest("tr[data-p-index]");
  let val;
  if (el.type === "number") val = el.value === "" ? null : Number(el.value);
  else val = el.value;
  if (row) {
    state.fields[fi].particles[+row.dataset.pIndex][el.dataset.k] = val;
  } else if (el.dataset.k === "name") {
    state.fields[fi].name = val;
  } else if (el.dataset.k.startsWith("shift.")) {
    state.fields[fi].shift[el.dataset.k.slice(6)] = val;
  }
  saveDraft();
});
document.getElementById("tolerance").addEventListener("input", (e) => {
  state.tolerance = e.target.value === "" ? null : Number(e.target.value);
  saveDraft();
});

document.getElementById("fields").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const card = btn.closest(".field-card");
  const fi = +card.dataset.fieldIndex;
  if (btn.dataset.act === "add-particle") {
    state.fields[fi].particles.push({id:"", x:0, y:0, category:""});
    saveDraft(); render();
  } else if (btn.dataset.act === "del-particle") {
    const pi = +btn.closest("tr[data-p-index]").dataset.pIndex;
    state.fields[fi].particles.splice(pi, 1);
    saveDraft(); render();
  } else if (btn.dataset.act === "del-field") {
    state.fields.splice(fi, 1);
    saveDraft(); render();
  }
});
document.getElementById("btnAddField").addEventListener("click", () => {
  if (state.fields.length < MAX_FIELDS) {
    state.fields.push(blankField(state.fields.length));
    saveDraft(); render();
  }
});
document.getElementById("btnSample").addEventListener("click", () => {
  state = sampleDraft(); saveDraft();
  document.getElementById("results").innerHTML = "";
  document.getElementById("okBox").style.display = "none";
  render();
});
document.getElementById("btnClear").addEventListener("click", () => {
  if (!confirm("确定清空当前草稿？")) return;
  state = defaultDraft(); saveDraft();
  document.getElementById("results").innerHTML = "";
  document.getElementById("okBox").style.display = "none";
  render();
});

function fmt(n) {
  return Number.isInteger(n) ? String(n) : String(Number(n).toFixed(3));
}

function renderResults(res) {
  const box = document.getElementById("results");
  const s = res.summary;
  let html = `
    <h2 style="font-size:16px;margin:4px 0 8px;">裁决结果</h2>
    <div class="summary">
      <div class="stat">最终颗粒总数<b>${s.finalParticleCount}</b></div>
      <div class="stat">观测总数<b>${s.totalObservations}</b></div>
      <div class="stat">所选关联数<b>${s.associationCount}</b></div>
      <div class="stat">曼哈顿差总和<b>${fmt(s.totalManhattan)}</b></div>
      <div class="stat">使用容差<b>${fmt(res.tolerance)}</b></div>
    </div>`;
  res.finalParticles.forEach(p => {
    html += `<div class="particle">
      <h3>最终颗粒 ${p.finalParticleId}
        <span class="tag">类别 ${esc(p.category)}</span>
        <span class="tag">${p.observationCount} 个观测</span></h3>
      <div class="rep">代表坐标（录入最早视野中的观测，滤膜坐标系）：
        <b>(${fmt(p.representativeCoordinate.x)}, ${fmt(p.representativeCoordinate.y)})</b>
        来自 ${esc(p.representativeCoordinate.fieldName)} / ${esc(p.representativeCoordinate.particleId)}</div>
      <table class="detail">
        <thead><tr><th>视野(序号)</th><th>颗粒编号</th><th>类别</th>
          <th>局部坐标</th><th>滤膜坐标</th></tr></thead><tbody>`;
    p.observations.forEach(o => {
      html += `<tr><td>${esc(o.fieldName)}（#${o.fieldIndex + 1}）</td>
        <td>${esc(o.particleId)}</td><td>${esc(o.category)}</td>
        <td>(${o.local.x}, ${o.local.y})</td>
        <td>(${fmt(o.filter.x)}, ${fmt(o.filter.y)})</td></tr>`;
    });
    html += `</tbody></table>`;
    if (p.associations.length) {
      html += `<table class="detail"><thead><tr><th>关联</th><th>|Δx|</th><th>|Δy|</th><th>曼哈顿差</th></tr></thead><tbody>`;
      p.associations.forEach(a => {
        html += `<tr><td>${esc(a.from.fieldName)}/${esc(a.from.particleId)} ↔
                  ${esc(a.to.fieldName)}/${esc(a.to.particleId)}</td>
          <td>${fmt(a.deltaX)}</td><td>${fmt(a.deltaY)}</td><td>${fmt(a.manhattan)}</td></tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `</div>`;
  });
  box.innerHTML = html;
}

document.getElementById("btnSubmit").addEventListener("click", async () => {
  clearHighlights();
  const errBox = document.getElementById("errorBox");
  const errList = document.getElementById("errorList");
  const okBox = document.getElementById("okBox");
  errBox.style.display = "none";
  errList.innerHTML = "";

  // 服务端为最终裁决；页面仅依赖 422 反馈做定位高亮，草稿始终保留
  try {
    const resp = await fetch("/api/particle-deduplications", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(state),
    });
    const data = await resp.json();
    if (resp.status === 422) {
      errBox.style.display = "block";
      (data.errors || []).forEach(e => {
        const li = document.createElement("li");
        li.innerHTML = `<code>${esc(e.loc)}</code> ${esc(e.message)}`;
        errList.appendChild(li);
        locate(e.loc);
      });
      document.getElementById("results").innerHTML = "";
      okBox.style.display = "none";
      return; // 草稿始终保留在 localStorage 与页面中
    }
    if (!resp.ok) {
      errBox.style.display = "block";
      errList.innerHTML = `<li>服务异常（HTTP ${resp.status}），草稿已保留</li>`;
      return;
    }
    renderResults(data);
    okBox.textContent = `裁决完成：${data.summary.finalParticleCount} 个最终颗粒，已选 ${data.summary.associationCount} 条关联，曼哈顿差总和 ${fmt(data.summary.totalManhattan)}。`;
    okBox.style.display = "block";
  } catch (e) {
    errBox.style.display = "block";
    errList.innerHTML = `<li>网络或服务不可用：${esc(e.message)}（草稿已保留）</li>`;
  }
});

render();
</script>
</body>
</html>
